<link rel="icon" type="image/svg+xml" href="assets/logos/mediaservi-badge.svg">
<link rel="icon" type="image/png" sizes="64x64" href="assets/logos/mediaservi-favicon.png">
<link rel="apple-touch-icon" href="assets/logos/mediaservi-apple-touch.png">

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<style>
:root{
  --green:#00ff04; --blue:#00b4ff; --violet:#9900ff; --magenta:#e100ff;
  --amber:#ffb000; --ink:#07060b; --text:#eef0f5; --muted:#9a98a8; --wa:#25d366;
  --steel:linear-gradient(90deg,#8d9198,#e6e8ec 22%,#a9adb4 48%,#f3f4f6 70%,#8a8e95);
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --top:calc(70px + var(--safe-t)); --bot:calc(74px + var(--safe-b));
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--ink);color:var(--text);font-family:Inter,system-ui,sans-serif;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
body{height:100dvh;touch-action:none}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
canvas#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#wipe{position:fixed;inset:0;width:100%;height:100%;z-index:60;pointer-events:none}
.scan{position:fixed;inset:0;z-index:55;pointer-events:none;background:repeating-linear-gradient(180deg,rgba(255,255,255,.018) 0 1px,transparent 1px 3px);mix-blend-mode:overlay}
.vign{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,transparent 45%,rgba(0,0,0,.6) 100%)}
.bgvid{position:fixed;inset:0;z-index:1;overflow:hidden;pointer-events:none;opacity:0;transition:opacity 1.4s ease;mix-blend-mode:screen;
  -webkit-mask:radial-gradient(ellipse at 50% 50%,#000 35%,transparent 85%);mask:radial-gradient(ellipse at 50% 50%,#000 35%,transparent 85%)}
.bgvid.on{opacity:.5}
.bgvid iframe{position:absolute;left:50%;top:50%;width:100vw;height:56.25vw;min-width:177.78vh;min-height:100vh;border:0;transform:translate(-50%,-50%) scale(1.35)}
#stars{position:fixed;inset:0;width:100%;height:100%;z-index:2;pointer-events:none;opacity:0;transition:opacity 1.4s ease}
#stars.on{opacity:1}

/* ============ CABECERA ============ */
.top{position:fixed;left:0;right:0;top:0;z-index:30;height:var(--top);padding:calc(12px + var(--safe-t)) clamp(16px,3vw,34px) 0;display:flex;justify-content:space-between;align-items:center;gap:12px}
.badge{display:block;width:clamp(44px,5vw,54px);height:clamp(44px,5vw,54px);cursor:pointer;filter:drop-shadow(0 4px 14px rgba(0,0,0,.6)) drop-shadow(0 0 14px rgba(153,0,255,.35))}
.badge svg,.badge img{width:100%;height:100%;display:block}
.hud{display:flex;align-items:center;gap:12px;font:600 11px/1 'Share Tech Mono',monospace;letter-spacing:.2em;color:#b3afc4}
.hud .rec{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;border:1px solid rgba(153,0,255,.45);background:rgba(20,8,36,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.hud .rec i{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green);animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.25}}
#tc{min-width:12ch;text-align:right;color:var(--amber);text-shadow:0 0 8px rgba(255,176,0,.5)}
.langb{position:relative}
.langb>button{display:flex;align-items:center;gap:7px;height:34px;padding:0 10px;border-radius:999px;border:1px solid rgba(255,255,255,.16);background:rgba(10,9,14,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:#e9e7f2;font:600 11px/1 'Share Tech Mono',monospace;letter-spacing:.16em;transition:border-color .25s,color .25s}
.langb>button:hover{border-color:rgba(0,255,4,.6);color:var(--green)}
.ic-lang{width:20px;height:20px;background:currentColor;-webkit-mask:url(assets/img/ic-lang.png) center/contain no-repeat;mask:url(assets/img/ic-lang.png) center/contain no-repeat}
.langm{position:absolute;right:0;top:42px;display:none;flex-direction:column;gap:6px;padding:8px;border-radius:8px;background:rgba(12,11,18,.95);border:1px solid rgba(255,255,255,.12);box-shadow:0 18px 40px rgba(0,0,0,.6);z-index:5}
.langm.open{display:flex}
.langm button{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:5px;font:700 12px/1 Inter,sans-serif;letter-spacing:.06em;white-space:nowrap;color:#d8d6e2}
.langm button:hover{background:rgba(255,255,255,.06)}
.langm button.sel{color:var(--green);box-shadow:inset 0 0 0 1px rgba(0,255,4,.4)}
.langm svg{width:24px;height:16px;border-radius:2px}
.corner{position:fixed;z-index:29;width:22px;height:22px;pointer-events:none;border-color:rgba(255,255,255,.28);border-style:solid;border-width:0}
.c1{left:12px;top:calc(var(--top) - 4px);border-left-width:2px;border-top-width:2px}.c2{right:12px;top:calc(var(--top) - 4px);border-right-width:2px;border-top-width:2px}
.c3{left:12px;bottom:calc(var(--bot) - 4px);border-left-width:2px;border-bottom-width:2px}.c4{right:12px;bottom:calc(var(--bot) - 4px);border-right-width:2px;border-bottom-width:2px}

/* ============ NAVEGACIÓN ============ */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;height:var(--bot);padding:0 clamp(12px,3vw,34px) calc(14px + var(--safe-b));display:flex;flex-direction:column;justify-content:flex-end;gap:10px}
.prog{height:3px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}
.prog b{display:block;height:100%;width:20%;border-radius:3px;background:linear-gradient(90deg,var(--violet),var(--blue),var(--green));box-shadow:0 0 12px rgba(0,180,255,.6);transition:width .9s cubic-bezier(.7,0,.2,1)}
.chs{display:flex;justify-content:space-between;gap:6px}
.ch{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:8px;height:34px;border-radius:4px;cursor:pointer;border:1px solid #000;color:#77748a;
  background:linear-gradient(180deg,rgba(255,255,255,.05),transparent 30%),#121116;box-shadow:0 2px 0 #000,inset 0 1px 0 rgba(255,255,255,.06);
  font:600 11px/1 'Share Tech Mono',monospace;letter-spacing:.18em;transition:color .3s,box-shadow .3s,background .3s;white-space:nowrap;overflow:hidden}
.ch em{font:900 15px/1 'Doto',monospace;font-style:normal;letter-spacing:.06em}
.ch:hover{color:#d8d6e2}
.ch.on{color:var(--green);background:linear-gradient(180deg,rgba(0,255,4,.08),transparent 40%),#07140a;box-shadow:0 2px 0 #000,0 0 0 1px rgba(0,255,4,.35),0 0 18px rgba(0,255,4,.18)}
.ch.on em{text-shadow:0 0 8px rgba(0,255,4,.8)}
.arrow{position:fixed;z-index:31;top:50%;width:46px;height:46px;margin-top:-23px;border-radius:50%;border:1px solid rgba(255,255,255,.14);background:rgba(10,9,14,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;color:#cfcbe0;transition:border-color .25s,color .25s,box-shadow .25s}
.arrow:hover{border-color:rgba(0,255,4,.6);color:var(--green);box-shadow:0 0 18px rgba(0,255,4,.25)}
.arrow svg{width:18px;height:18px}
.arrow.prev{left:clamp(10px,2vw,26px)}.arrow.next{right:clamp(10px,2vw,26px)}

/* ============ WHATSAPP (todas las páginas) ============ */
.wa{position:fixed;z-index:32;right:clamp(14px,2.4vw,30px);bottom:calc(var(--bot) + 14px);display:flex;align-items:center;gap:10px;padding:6px 16px 6px 6px;border-radius:999px;
  background:rgba(8,20,12,.78);border:1px solid rgba(37,211,102,.45);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 10px 30px rgba(0,0,0,.5),0 0 22px rgba(37,211,102,.18);
  font:700 12px/1 Inter,sans-serif;letter-spacing:.04em;color:#e8fff0;transition:transform .25s,box-shadow .25s}
.wa:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(0,0,0,.5),0 0 30px rgba(37,211,102,.4)}
.wa .ico{position:relative;width:40px;height:40px;border-radius:50%;background:var(--wa);display:flex;align-items:center;justify-content:center;flex:none;animation:ring 7s ease-in-out infinite}
.wa .ico svg{width:23px;height:23px;fill:#fff}
.wa .ico::before,.wa .ico::after{content:'';position:absolute;inset:0;border-radius:50%;border:2px solid var(--wa);opacity:0;animation:ripple 7s ease-out infinite}
.wa .ico::after{animation-delay:.35s}
@keyframes ring{0%,84%,100%{transform:none}86%{transform:rotate(-16deg)}87.5%{transform:rotate(14deg)}89%{transform:rotate(-12deg)}90.5%{transform:rotate(10deg)}92%{transform:rotate(-6deg)}93.5%{transform:none}}
@keyframes ripple{0%,84%{opacity:0;transform:scale(1)}86%{opacity:.8}96%{opacity:0;transform:scale(1.9)}100%{opacity:0}}

/* ============ DIAPOSITIVAS ============ */
.deck{position:fixed;left:0;right:0;top:var(--top);bottom:var(--bot);z-index:5}
.slide{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;visibility:hidden;pointer-events:none}
.slide.on{visibility:visible;pointer-events:auto}
.fit{transform-origin:50% 50%;padding:12px clamp(16px,6vw,90px)}
.slide [data-in]{opacity:0}
.slide.enter [data-in]{animation:inR .85s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*70ms + 120ms)}
.slide.enter.back [data-in]{animation-name:inL}
@keyframes inR{0%{opacity:0;transform:translateX(60px) skewX(-8deg);filter:blur(10px) drop-shadow(-6px 0 0 rgba(0,255,4,.8)) drop-shadow(6px 0 0 rgba(225,0,255,.8))}
  60%{opacity:1;filter:blur(0) drop-shadow(-2px 0 0 rgba(0,255,4,.5)) drop-shadow(2px 0 0 rgba(225,0,255,.5))}100%{opacity:1;transform:none;filter:none}}
@keyframes inL{0%{opacity:0;transform:translateX(-60px) skewX(8deg);filter:blur(10px) drop-shadow(6px 0 0 rgba(0,255,4,.8)) drop-shadow(-6px 0 0 rgba(225,0,255,.8))}
  60%{opacity:1;filter:blur(0) drop-shadow(2px 0 0 rgba(0,255,4,.5)) drop-shadow(-2px 0 0 rgba(225,0,255,.5))}100%{opacity:1;transform:none;filter:none}}
.slide.leave [data-in]{opacity:1;animation:out .35s ease-in both}
@keyframes out{to{opacity:0;filter:blur(8px) brightness(0)}}

.kick{font:600 clamp(11px,1.4vw,13px)/1 'Share Tech Mono',monospace;letter-spacing:.42em;padding-left:.42em;color:#b3afc4;text-align:center}
.h2{font:900 clamp(26px,4.6vw,56px)/1.05 Inter,sans-serif;letter-spacing:.04em;text-align:center;text-transform:uppercase;background:var(--steel);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 18px rgba(0,0,0,.7))}
.h2 span{background:linear-gradient(90deg,var(--green),var(--blue) 50%,var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}
.head{display:flex;flex-direction:column;align-items:center;gap:12px;margin-bottom:clamp(18px,3.4vh,34px)}

/* 01 · INICIO */
.home{display:flex;flex-direction:column;align-items:center}
.face{position:relative;display:block;width:clamp(220px,46vh,460px);cursor:pointer}
.face::before{content:'';position:absolute;inset:6% 2% 4%;background:radial-gradient(closest-side,rgba(153,0,255,.5),rgba(0,180,255,.12) 60%,transparent 78%);filter:blur(8px);z-index:-1;animation:breathe 6s ease-in-out infinite}
@keyframes breathe{50%{opacity:.6;transform:scale(.96)}}
.face img{display:block;width:100%;height:auto;filter:drop-shadow(0 24px 40px rgba(0,0,0,.75));animation:float 8s ease-in-out infinite;transition:filter .35s}
.face:hover img,.face:focus-visible img{filter:drop-shadow(0 24px 40px rgba(0,0,0,.75)) drop-shadow(0 0 22px rgba(0,180,255,.55))}
@keyframes float{50%{transform:translateY(-8px)}}
.face .li{position:absolute;right:9%;top:62%;width:42px;height:42px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:#0a66c2;color:#fff;font:900 22px/1 Inter,sans-serif;letter-spacing:-.04em;
  box-shadow:0 8px 20px rgba(0,0,0,.5);opacity:0;transform:scale(.6) rotate(-10deg);transition:opacity .3s,transform .35s cubic-bezier(.3,1.6,.5,1)}
.face:hover .li,.face:focus-visible .li{opacity:1;transform:none}
.mlogo{position:relative;width:clamp(260px,62vh,640px);margin-top:-3%}
.mlogo img{display:block;width:100%;height:auto;filter:drop-shadow(0 10px 24px rgba(0,0,0,.7)) drop-shadow(0 0 18px rgba(96,255,0,.18))}
.mlogo .shine{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;
  -webkit-mask:url(assets/logos/mediaservi-logo-metacrilato.png) center/100% 100% no-repeat;mask:url(assets/logos/mediaservi-logo-metacrilato.png) center/100% 100% no-repeat;
  background:linear-gradient(105deg,transparent 42%,rgba(255,255,255,0) 45%,rgba(255,255,255,.95) 50%,rgba(220,255,200,0) 55%,transparent 58%) no-repeat;background-size:320% 100%;
  animation:shine 4s ease-in-out infinite}
@keyframes shine{0%{background-position:130% 0}45%,100%{background-position:-30% 0}}

/* 02 · MUSEO DIGITAL */
.g4{display:grid;gap:clamp(8px,1.2vw,14px);grid-template-columns:repeat(4,minmax(0,1fr));width:min(1160px,86vw)}
.proj{position:relative;display:flex;flex-direction:column;border-radius:8px;overflow:hidden;background:rgba(14,13,18,.85);border:1px solid #000;box-shadow:0 2px 0 #000,inset 0 1px 0 rgba(255,255,255,.06);transition:transform .3s,box-shadow .3s;cursor:pointer}
.proj:hover{transform:translateY(-4px);box-shadow:0 2px 0 #000,0 0 0 1px var(--c),0 0 30px var(--cg)}
.proj .scr{position:relative;aspect-ratio:16/9;background:#000;overflow:hidden;border-bottom:1px solid #000}
.proj .scr img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s}
.proj:hover .scr img{transform:scale(1.06)}
.proj .scr::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(180deg,rgba(0,0,0,.2) 0 1px,transparent 1px 3px),linear-gradient(135deg,rgba(255,255,255,.1),transparent 45%)}
.proj .scr canvas{width:100%;height:100%;display:block}
.proj .bd{display:flex;flex-direction:column;gap:8px;padding:14px 16px 16px}
.lcd{display:flex;align-items:center;height:34px;padding:0 10px;border-radius:4px;background:#030a03;border:1px solid #000;box-shadow:inset 0 0 10px #000;
  background-image:radial-gradient(circle,rgba(0,255,4,.06) 0 1px,transparent 1.4px);background-size:4px 4px;
  font:800 clamp(14px,1.4vw,17px)/1 'Doto',monospace;letter-spacing:.12em;color:var(--green);text-shadow:0 0 8px rgba(0,255,4,.6);white-space:nowrap;overflow:hidden}
.proj small{font:600 11px/1.45 'Share Tech Mono',monospace;letter-spacing:.06em;color:#a7a4b6}
.proj .go{margin-top:2px;font:600 10px/1 'Share Tech Mono',monospace;letter-spacing:.24em;color:var(--c)}
.museum{position:absolute;inset:0;z-index:3;opacity:0;pointer-events:none;transition:opacity 1.2s ease}
.museum.on{opacity:1;pointer-events:auto}
.museum canvas{display:block;width:100%;height:100%;outline:none}
.museum .mtitle{position:absolute;left:50%;top:10px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;text-align:center}
.museum .mtitle b{font:900 clamp(16px,2.2vw,24px)/1 Inter,sans-serif;letter-spacing:.12em;text-transform:uppercase;background:var(--steel);-webkit-background-clip:text;background-clip:text;color:transparent}
.museum .mtitle span{font:600 10px/1 'Share Tech Mono',monospace;letter-spacing:.3em;color:#9a98a8}
.museum .cons{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:999px;font:600 11px/1 'Share Tech Mono',monospace;letter-spacing:.2em;color:#9ff;
  border:1px solid rgba(0,220,255,.45);background:rgba(2,14,22,.7);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);box-shadow:0 0 18px rgba(0,200,255,.25)}
.museum .cons i{width:7px;height:7px;border-radius:50%;background:#2ff;box-shadow:0 0 8px #2ff;animation:pulse 1.4s infinite}
.museum .tip{position:absolute;pointer-events:none;padding:6px 10px;border-radius:4px;background:rgba(0,0,0,.75);border:1px solid rgba(255,255,255,.15);font:600 10px/1 'Share Tech Mono',monospace;letter-spacing:.18em;color:#fff;opacity:0;transition:opacity .2s;white-space:nowrap}
.enter-flash{position:absolute;inset:0;z-index:4;pointer-events:none;background:radial-gradient(circle at 50% 50%,rgba(255,255,255,.0),rgba(0,0,0,0));opacity:0}

/* Pantalla holográfica */
.holo{position:fixed;z-index:40;left:0;right:0;top:var(--top);bottom:var(--bot);display:none;align-items:center;justify-content:center;padding:clamp(8px,2vw,26px)}
.holo.open{display:flex}
.holo .hw{position:relative;width:min(1240px,100%);height:100%;display:flex;flex-direction:column;border-radius:10px;overflow:hidden;
  background:rgba(3,12,22,.82);border:1px solid rgba(0,220,255,.55);box-shadow:0 0 0 1px rgba(0,0,0,.6),0 0 40px rgba(0,200,255,.35),inset 0 0 60px rgba(0,180,255,.12);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transform-origin:var(--ox,50%) var(--oy,50%)}
.holo.open .hw{animation:holoIn .75s cubic-bezier(.2,.9,.2,1) both}
.holo.closing .hw{animation:holoOut .35s ease-in both}
@keyframes holoIn{0%{transform:scale(.03);opacity:0;filter:blur(8px) hue-rotate(60deg)}35%{opacity:1;filter:blur(2px)}55%{transform:scale(1.02,.98)}70%{opacity:.75}75%{opacity:1}100%{transform:none;opacity:1;filter:none}}
@keyframes holoOut{to{transform:scale(.6,.02);opacity:0;filter:blur(6px)}}
.holo .hw::after{content:'';position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(180deg,rgba(0,220,255,.05) 0 1px,transparent 1px 4px);animation:hflick 5s steps(1) infinite}
@keyframes hflick{0%,96%,100%{opacity:1}97%{opacity:.4}98%{opacity:1}99%{opacity:.6}}
.hh{display:flex;align-items:center;gap:12px;height:44px;padding:0 12px 0 14px;border-bottom:1px solid rgba(0,220,255,.3);background:linear-gradient(90deg,rgba(0,220,255,.12),transparent 60%)}
.hh .live{display:inline-flex;align-items:center;gap:7px;padding:5px 9px;border-radius:3px;background:#c4001a;font:700 10px/1 'Share Tech Mono',monospace;letter-spacing:.2em;color:#fff;box-shadow:0 0 12px rgba(255,0,40,.5)}
.hh .live i{width:6px;height:6px;border-radius:50%;background:#fff;animation:pulse 1s infinite}
.hh b{flex:1;min-width:0;font:800 clamp(14px,1.6vw,18px)/1 'Doto',monospace;letter-spacing:.14em;color:#9ff;text-shadow:0 0 10px rgba(0,230,255,.7);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hh a,.hh button{display:flex;align-items:center;justify-content:center;height:30px;min-width:30px;padding:0 10px;border-radius:4px;border:1px solid rgba(0,220,255,.4);font:600 11px/1 'Share Tech Mono',monospace;letter-spacing:.14em;color:#cff;transition:background .2s}
.hh a:hover,.hh button:hover{background:rgba(0,220,255,.15)}
.hb{flex:1;min-height:0;display:flex}
.hc{flex:none;width:220px;display:flex;flex-direction:column;gap:8px;padding:12px;border-right:1px solid rgba(0,220,255,.25);background:rgba(0,30,45,.35)}
.hc p{font:600 10px/1 'Share Tech Mono',monospace;letter-spacing:.3em;color:#6cc}
.hc ul{list-style:none;display:flex;flex-direction:column;gap:6px}
.hc li button{width:100%;display:flex;align-items:center;gap:10px;padding:10px;border-radius:4px;text-align:left;border:1px solid rgba(0,220,255,.18);background:rgba(0,0,0,.25);font:800 13px/1 'Doto',monospace;letter-spacing:.1em;color:#bfe;transition:background .2s,border-color .2s}
.hc li button i{width:8px;height:8px;border-radius:50%;flex:none;background:var(--c);box-shadow:0 0 8px var(--c)}
.hc li button:hover{background:rgba(0,220,255,.1)}
.hc li button.sel{border-color:#2ff;background:rgba(0,220,255,.16);color:#fff}
.hv{position:relative;flex:1;min-width:0;background:#000}

  const dust = new THREE.Points(pgeo, new THREE.PointsMaterial({ color: '#c9a8ff', size: .04, transparent: true, opacity: .7, blending: THREE.AdditiveBlending, depthWrite: false })); scene.add(dust);
  // haces de luz desde el techo
  const beamM = new THREE.MeshBasicMaterial({ color: '#8a40ff', transparent: true, opacity: .07, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide });
  const beam = new THREE.Mesh(new THREE.ConeGeometry(2.2, 9, 48, 1, true), beamM); beam.position.set(0, 4.5, -4); scene.add(beam);

  // cámara: entrada atravesando el pórtico
  let running = false, raf = 0, tStart = 0, mx = 0, my = 0, hovered = null, last = 0;
  const ray = new THREE.Raycaster(), ptr = new THREE.Vector2(), tip = host.querySelector('.tip');
  function resize() { const w = host.clientWidth, h = host.clientHeight; renderer.setSize(w, h, false); cam.aspect = w / h; cam.updateProjectionMatrix(); }
  addEventListener('resize', () => running && resize());
  const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  function frame(now) {
    if (!running) return; raf = requestAnimationFrame(frame);
    const t = (now - tStart) / 1000, dt = Math.min(.05, (now - last) / 1000); last = now;
    const portrait = cam.aspect < 1, k = Math.min(1, t / 3.4), e = ease(k);
    const zEnd = portrait ? 10 : 7.2, fovEnd = portrait ? 76 : 60;
    cam.fov = 70 + (fovEnd - 70) * e; cam.updateProjectionMatrix();
    const sway = portrait ? Math.sin(t * .22) * 7 : Math.sin(t * .12) * 1.2;
    cam.position.set(mx * 1.2 * e, 2.3 - .2 * e + my * .3 * e, 24 + (zEnd - 24) * e);
    cam.lookAt(sway * e + mx * 2 * e, 2.9, -8);
    portal.children.forEach(m => m.material.color.setHSL(.33, 1, .5 * (1 - e * .6)));
    // rotación de contenidos
    paintings.forEach((P, i) => { const phase = Math.floor((t + i * 2.5) / 9) % 2 === 1; if (phase !== P.info) { P.info = phase; P.dirty = true; }
      if (!P.p.img || P.dirty) { drawPainting(P.p, P.cv, t, P.info, P.im); P.tex.needsUpdate = true; P.dirty = false; }
      const target = hovered === P ? 1 : 0; P.hover += (target - P.hover) * Math.min(1, dt * 8);
      P.grp.scale.setScalar(1 + .04 * P.hover); P.halo.material.opacity = .28 + .4 * P.hover; });
    if (t - monoT > 5) { monoK = (monoK + 1) % PROJS.length; monoT = t; }
    drawMono(t);
    mono.rotation.y = Math.sin(t * .3) * .08; beamM.opacity = .05 + .03 * Math.sin(t * 1.3);
    const pa = pgeo.attributes.position; for (let i = 0; i < N; i++) { let y = pa.getY(i) + dt * .15; if (y > 9) y = 0; pa.setY(i, y); } pa.needsUpdate = true;
    renderer.render(scene, cam);
  }
  function pick(cx, cy) { const r = renderer.domElement.getBoundingClientRect(); ptr.set((cx - r.left) / r.width * 2 - 1, -(cy - r.top) / r.height * 2 + 1); ray.setFromCamera(ptr, cam);
    const hit = ray.intersectObjects([...paintings.map(P => P.scr), face], false)[0]; if (!hit) return null; return hit.object.userData.mono ? { mono: true } : paintings[hit.object.userData.k]; }
  renderer.domElement.addEventListener('pointermove', e => {
    const r = renderer.domElement.getBoundingClientRect(); mx = (e.clientX - r.left) / r.width * 2 - 1; my = -((e.clientY - r.top) / r.height * 2 - 1);
    const h = pick(e.clientX, e.clientY); hovered = h && !h.mono ? h : null; renderer.domElement.style.cursor = h ? 'pointer' : 'default';
    if (h) { tip.textContent = h.mono ? T('▶ ENTRAR: ', '▶ ENTER: ') + PROJS[monoK].n : '▶ ' + h.p.n; tip.style.left = (e.clientX - r.left + 14) + 'px'; tip.style.top = (e.clientY - r.top + 14) + 'px'; tip.style.opacity = 1; } else tip.style.opacity = 0;
  });
  renderer.domElement.addEventListener('click', e => { const h = pick(e.clientX, e.clientY); if (!h) return; window.__openHolo(h.mono ? monoK : h.k, e.clientX, e.clientY); });
  window.__museumFocus = () => monoK;
  function relabel() { paintings.forEach(P => { P.dirty = true; drawPlaque(P); }); }
  window.__museumLang = () => { LANG = document.documentElement.lang === 'en' ? 'en' : 'es'; relabel(); };
  return {
    start(lang) { LANG = lang; relabel(); resize(); running = true; tStart = last = performance.now(); monoT = 0; cancelAnimationFrame(raf); raf = requestAnimationFrame(frame); },
    stop() { running = false; cancelAnimationFrame(raf); }
  };
};
</script>
</body>
