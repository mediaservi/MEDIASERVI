<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e1e21">
<meta name="robots" content="noindex, nofollow">
<title>KLUB</title>
<link rel="icon" type="image/svg+xml" href="../assets/logos/mediaservi-badge.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Inter:wght@700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#2a2a2d;color:#eee;font-family:'Share Tech Mono',monospace}
body{height:100dvh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
/* fondo fijo: panorámica en blanco y negro centrada en el logo */
.pano{position:fixed;inset:0;background:#2a2a2d url(../assets/img/klub.webp) 50% 50%/auto 100% no-repeat;filter:grayscale(1) brightness(.62) contrast(1.05)}
/* textura chesterfield muy sutil */
.sofa{position:fixed;left:50%;bottom:-4vh;width:min(1500px,120vw);aspect-ratio:529/220;transform:translateX(-50%);background:url(../assets/img/chesterfield.webp) center/contain no-repeat;opacity:.16;filter:grayscale(.4) blur(1.2px) sepia(.4);mix-blend-mode:luminosity;pointer-events:none}
.vig{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 35%,rgba(0,0,0,.7) 100%);pointer-events:none}
/* posters con marco dorado */
.apps{position:fixed;left:0;right:0;top:calc(76px + env(safe-area-inset-top,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;align-items:center;padding:0 clamp(10px,2vw,30px);pointer-events:none}
.frame{position:relative;height:100%;max-width:calc((100vw - min(58vw,620px)) / 2 - 20px);aspect-ratio:2/3;padding:clamp(12px,1.6vw,20px);pointer-events:auto;
  background:
    repeating-linear-gradient(90deg,rgba(255,240,190,.08) 0 1px,transparent 1px 3px),
    linear-gradient(135deg,#6e4f16 0%,#e6c46a 14%,#a9832f 30%,#f6e08f 46%,#9c7526 62%,#d8b457 78%,#6a4b14 100%);
  box-shadow:0 30px 70px rgba(0,0,0,.75),inset 0 0 0 1px #2c1f06,inset 0 0 0 3px #8f6c22,inset 3px 3px 5px rgba(255,244,200,.65),inset -4px -4px 8px rgba(50,32,4,.75)}
.frame::before{content:'';position:absolute;inset:calc(clamp(12px,1.6vw,20px) - 7px);border:4px dotted #e9c967;border-radius:2px;box-shadow:0 0 0 2px #3a2a0a,inset 0 0 0 2px #3a2a0a;filter:drop-shadow(0 1px 0 rgba(0,0,0,.6))}
.frame .mat{position:relative;width:100%;height:100%;padding:clamp(4px,.5vw,8px);background:#efe8d8;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25),inset 2px 2px 6px rgba(0,0,0,.35)}
.frame iframe{display:block;width:100%;height:100%;border:0;background:#111}
.frame span{position:absolute;left:50%;bottom:-26px;transform:translateX(-50%);white-space:nowrap;font-size:10px;letter-spacing:.24em;color:#cfc6b0;text-shadow:0 1px 2px #000}
@media (orientation:portrait){
  .apps{flex-direction:column;justify-content:center;gap:14px;top:calc(74px + env(safe-area-inset-top,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px))}
  .frame{height:calc(50% - 7px);max-width:92vw}
  .frame span{display:none}
  .pano{background-size:auto 60%;background-position:50% 45%;filter:grayscale(1) brightness(.28)}
  .vig{background:radial-gradient(ellipse 55% 60% at 50% 50%,transparent 20%,rgba(0,0,0,.92) 85%)}
}
/* cabecera */
.top{position:fixed;left:0;right:0;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:calc(14px + env(safe-area-inset-top,0px)) 18px 0}
.top a{display:flex;align-items:center;text-decoration:none;color:#eee}
.top img{width:48px;height:48px;filter:drop-shadow(0 4px 14px rgba(0,0,0,.7))}
.acts{display:flex;gap:10px;align-items:center}
.pill{display:flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:999px;border:1px solid rgba(255,255,255,.3);background:rgba(0,0,0,.5);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);font-size:11px;letter-spacing:.24em;transition:border-color .25s,color .25s}
.pill:hover{border-color:#e9c967;color:#e9c967}
.pill svg{width:14px;height:14px;fill:currentColor}
/* candado y zona privada */
.modal{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.modal.open{display:flex}
.box{width:min(360px,88vw);display:flex;flex-direction:column;gap:14px;padding:24px;border-radius:10px;background:#18171b;border:1px solid rgba(233,201,103,.45);box-shadow:0 30px 70px rgba(0,0,0,.7)}
.box h2{display:flex;align-items:center;gap:10px;font:900 16px/1 Inter,sans-serif;letter-spacing:.2em;color:#e9c967}
.box h2 svg{width:18px;height:18px;fill:currentColor}
.box input{height:44px;padding:0 14px;border-radius:6px;border:1px solid rgba(255,255,255,.2);background:#0d0c10;color:#fff;font:600 16px/1 'Share Tech Mono',monospace;letter-spacing:.2em}
.box input:focus{outline:none;border-color:#e9c967}
.box .row{display:flex;gap:10px;justify-content:flex-end}
.box .ok{padding:10px 16px;border-radius:6px;background:linear-gradient(90deg,#c9a548,#f2d98a);color:#1a1405;font:900 12px/1 Inter,sans-serif;letter-spacing:.16em}
.box .ko{padding:10px 16px;border-radius:6px;border:1px solid rgba(255,255,255,.2);font-size:11px;letter-spacing:.16em}
.box .err{min-height:14px;font-size:11px;letter-spacing:.14em;color:#ff6b6b}
.box.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.priv{position:fixed;inset:0;z-index:8;display:none;flex-direction:column;background:#111013}
.priv.open{display:flex}
.priv .ph{display:flex;justify-content:space-between;align-items:center;padding:calc(18px + env(safe-area-inset-top,0px)) 18px 16px;border-bottom:1px solid rgba(233,201,103,.25)}
.priv .ph b{font:900 16px/1 Inter,sans-serif;letter-spacing:.3em;color:#e9c967}
.priv .grid{flex:1;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;padding:20px;align-content:start;overflow:auto}
.priv .card{display:flex;align-items:center;justify-content:center;min-height:140px;border-radius:8px;border:1px dashed rgba(233,201,103,.35);color:#8d8676;font-size:11px;letter-spacing:.2em;text-align:center;padding:10px}
</style>
</head>
<body>
<div class="pano" role="img" aria-label="KLUB"></div>
<div class="sofa"></div>
<div class="vig"></div>
<main class="apps">
  <div class="frame"><div class="mat"><iframe src="https://msp-theater.netlify.app/" title="POSTERS CINE" allow="autoplay; fullscreen" allowfullscreen></iframe></div><span>POSTERS CINE</span></div>
  <div class="frame"><div class="mat"><iframe src="https://msp-klub.netlify.app/" title="POSTERS KLUB" allow="autoplay; fullscreen" allowfullscreen></iframe></div><span>POSTERS KLUB</span></div>
</main>
<header class="top">
  <a href="../"><img src="../assets/logos/mediaservi-badge.svg" alt="mediaservi.com"></a>
  <div class="acts">
    <button class="pill" id="lock" aria-label="🔒"><svg viewBox="0 0 24 24"><path d="M12 1a5 5 0 0 0-5 5v4H5v13h14V10h-2V6a5 5 0 0 0-5-5zm-3 9V6a3 3 0 1 1 6 0v4z"/></svg></button>
    <a class="pill" href="../#conecta" id="back">← VOLVER</a>
  </div>
</header>
<div class="modal" id="modal">
  <form class="box" id="box" autocomplete="off">
    <h2><svg viewBox="0 0 24 24"><path d="M12 1a5 5 0 0 0-5 5v4H5v13h14V10h-2V6a5 5 0 0 0-5-5zm-3 9V6a3 3 0 1 1 6 0v4z"/></svg>KLUB</h2>
    <input type="password" id="pw" placeholder="••••••••" aria-label="Clave">
    <span class="err" id="err"></span>
    <div class="row"><button type="button" class="ko" id="cancel">✕</button><button type="submit" class="ok" id="okb">ENTRAR</button></div>
  </form>
</div>
<section class="priv" id="priv">
  <div class="ph"><b>KLUB · PRIVATE</b><button class="pill" id="out">✕</button></div>
  <div class="grid"><div class="card" id="soon">ÁLBUMES DE FOTOS · PRÓXIMAMENTE</div></div>
</section>
<script>
(() => {
  let l = null; try { l = localStorage.getItem('ms-lang'); } catch (e) {}
  if (!l) { let tz = ''; try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch (e) {}
    l = /^(Europe\/Madrid|Atlantic\/Canary|Africa\/Ceuta|America\/(Mexico_City|Cancun|Merida|Monterrey|Bogota|Lima|Santiago|Caracas|Guayaquil|La_Paz|Asuncion|Montevideo|Argentina\/.+|Buenos_Aires|Havana|Santo_Domingo|Panama|Costa_Rica|Managua|Tegucigalpa|El_Salvador|Guatemala|Puerto_Rico))$/.test(tz) ? 'es' : 'en'; }
  const en = l === 'en';
  if (en) { document.documentElement.lang = 'en'; document.getElementById('back').textContent = '← BACK'; document.getElementById('okb').textContent = 'ENTER'; document.getElementById('soon').textContent = 'PHOTO ALBUMS · COMING SOON'; }
  const modal = document.getElementById('modal'), box = document.getElementById('box'), pw = document.getElementById('pw'), err = document.getElementById('err'), priv = document.getElementById('priv');
  const H = '2d8f894b33e630ddd07416938bcb8d9875677daf3bd7f04af6c700f7b62b1a3c';
  const sha = async t => [...new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t)))].map(b => b.toString(16).padStart(2, '0')).join('');
  document.getElementById('lock').addEventListener('click', () => { modal.classList.add('open'); err.textContent = ''; pw.value = ''; setTimeout(() => pw.focus(), 50); });
  document.getElementById('cancel').addEventListener('click', () => modal.classList.remove('open'));
  modal.addEventListener('click', e => { if (e.target === modal) modal.classList.remove('open'); });
  box.addEventListener('submit', async e => { e.preventDefault();
    if (await sha(pw.value.trim().toLowerCase()) === H) { modal.classList.remove('open'); priv.classList.add('open'); }
    else { err.textContent = en ? 'WRONG KEY' : 'CLAVE INCORRECTA'; box.classList.remove('shake'); void box.offsetWidth; box.classList.add('shake'); pw.select(); } });
  document.getElementById('out').addEventListener('click', () => priv.classList.remove('open'));
  addEventListener('keydown', e => { if (e.key === 'Escape') { modal.classList.remove('open'); } });
})();
</script>
</body>
</html>
