<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e1e21">
<meta name="robots" content="noindex, nofollow">
<title>KLUB</title>
<link rel="icon" type="image/svg+xml" href="../assets/logos/mediaservi-badge.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Inter:wght@700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#2a2a2d;color:#eee;font-family:'Share Tech Mono',monospace}
body{height:100dvh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
/* fondo fijo: panorámica en blanco y negro centrada en el logo */
.pano{position:fixed;inset:0;background:#2a2a2d url(../assets/img/klub.webp) 50% 50%/auto 100% no-repeat;filter:grayscale(1) brightness(.62) contrast(1.05)}
.vig{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 35%,rgba(0,0,0,.7) 100%);pointer-events:none}
/* posters con marco dorado */
.apps{position:fixed;left:0;right:0;top:calc(76px + env(safe-area-inset-top,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;align-items:center;padding:0 clamp(10px,2vw,30px);pointer-events:none;container-type:size}
.frame{--P:clamp(12px,1.6vw,20px);position:relative;flex:none;padding:var(--P);pointer-events:auto;
  background:
    repeating-linear-gradient(90deg,rgba(255,240,190,.08) 0 1px,transparent 1px 3px),
    linear-gradient(135deg,#6e4f16 0%,#e6c46a 14%,#a9832f 30%,#f6e08f 46%,#9c7526 62%,#d8b457 78%,#6a4b14 100%);
  box-shadow:0 30px 70px rgba(0,0,0,.75),inset 0 0 0 1px #2c1f06,inset 0 0 0 3px #8f6c22,inset 3px 3px 5px rgba(255,244,200,.65),inset -4px -4px 8px rgba(50,32,4,.75)}
.frame::before{content:'';position:absolute;inset:calc(var(--P) - 7px);border:4px dotted #e9c967;border-radius:2px;box-shadow:0 0 0 2px #3a2a0a,inset 0 0 0 2px #3a2a0a;filter:drop-shadow(0 1px 0 rgba(0,0,0,.6))}
.frame .mat{position:relative;aspect-ratio:9/16;height:max(150px,min(calc(100cqh - 2 * var(--P)),calc((50cqw - 34vh - 2 * var(--P) - 12px) * 16 / 9)));padding:clamp(4px,.5vw,8px);background:#efe8d8;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25),inset 2px 2px 6px rgba(0,0,0,.35)}
.frame iframe{display:block;width:100%;height:100%;border:0;background:#111}
.frame span{position:absolute;left:50%;bottom:-26px;transform:translateX(-50%);white-space:nowrap;font-size:10px;letter-spacing:.24em;color:#cfc6b0;text-shadow:0 1px 2px #000}
@media (orientation:portrait){
  .apps{flex-direction:column;justify-content:center;gap:14px;top:calc(74px + env(safe-area-inset-top,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px))}
  .frame.cine{display:none}
  .frame .mat{height:min(calc(100cqh - 2 * var(--P)),calc((100cqw - 2 * var(--P)) * 16 / 9))}
  .frame span{display:none}
  .pano{background-size:auto 60%;background-position:50% 45%;filter:grayscale(1) brightness(.28)}
  .vig{background:radial-gradient(ellipse 55% 60% at 50% 50%,transparent 20%,rgba(0,0,0,.92) 85%)}
}
/* cabecera */
.top{position:fixed;left:0;right:0;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:calc(14px + env(safe-area-inset-top,0px)) 18px 0}
.top a{display:flex;align-items:center;text-decoration:none;color:#eee}
.top img{width:48px;height:48px;filter:drop-shadow(0 4px 14px rgba(0,0,0,.7))}
.acts{display:flex;gap:10px;align-items:center}
.pill{display:flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:999px;border:1px solid rgba(255,255,255,.3);background:rgba(0,0,0,.5);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);font-size:11px;letter-spacing:.24em;transition:border-color .25s,color .25s}
.pill:hover{border-color:#e9c967;color:#e9c967}
.pill svg{width:14px;height:14px;fill:currentColor}
/* volumen */
.snd svg{width:18px;height:18px}.snd .spk{fill:currentColor}
.snd .lv{display:flex;gap:2px;align-items:flex-end;height:12px}.snd .lv i{width:3px;border-radius:1px;background:currentColor;opacity:.25}
.snd .lv i:nth-child(1){height:4px}.snd .lv i:nth-child(2){height:8px}.snd .lv i:nth-child(3){height:12px}
.snd[data-v="0"] .w1,.snd[data-v="0"] .w2,.snd[data-v="1"] .w2,.snd:not([data-v="0"]) .x{display:none}
.snd[data-v="1"] .lv i:nth-child(-n+2),.snd[data-v="2"] .lv i{opacity:1}
.snd[data-v="2"]{color:#e9c967}
/* candado y zona privada */
.modal{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.modal.open{display:flex}
.box{width:min(360px,88vw);display:flex;flex-direction:column;gap:14px;padding:24px;border-radius:10px;background:#18171b;border:1px solid rgba(233,201,103,.45);box-shadow:0 30px 70px rgba(0,0,0,.7)}
.box h2{display:flex;align-items:center;gap:10px;font:900 16px/1 Inter,sans-serif;letter-spacing:.2em;color:#e9c967}
.box h2 svg{width:18px;height:18px;fill:currentColor}
.box input{height:44px;padding:0 14px;border-radius:6px;border:1px solid rgba(255,255,255,.2);background:#0d0c10;color:#fff;font:600 16px/1 'Share Tech Mono',monospace;letter-spacing:.2em}
.box input:focus{outline:none;border-color:#e9c967}
.box .row{display:flex;gap:10px;justify-content:flex-end}
.box .ok{padding:10px 16px;border-radius:6px;background:linear-gradient(90deg,#c9a548,#f2d98a);color:#1a1405;font:900 12px/1 Inter,sans-serif;letter-spacing:.16em}
.box .ko{padding:10px 16px;border-radius:6px;border:1px solid rgba(255,255,255,.2);font-size:11px;letter-spacing:.16em}
.box .err{min-height:14px;font-size:11px;letter-spacing:.14em;color:#ff6b6b}
.box.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.priv{position:fixed;inset:0;z-index:8;display:none;flex-direction:column;background:#111013}
.priv.open{display:flex}
.priv .ph{display:flex;justify-content:space-between;align-items:center;padding:calc(18px + env(safe-area-inset-top,0px)) 18px 16px;border-bottom:1px solid rgba(233,201,103,.25)}
.priv .ph b{font:900 16px/1 Inter,sans-serif;letter-spacing:.3em;color:#e9c967}
.priv .grid{flex:1;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;padding:20px;align-content:start;overflow:auto}
.priv .card{display:flex;align-items:center;justify-content:center;min-height:140px;border-radius:8px;border:1px dashed rgba(233,201,103,.35);color:#8d8676;font-size:11px;letter-spacing:.2em;text-align:center;padding:10px}
/* cine secreto: 4 s pulsando el logo del fondo y, al soltar, cae el telón rojo y se abre ante la pantalla */
.pano{touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;transition:filter .6s}
.pano.hold{filter:grayscale(0) brightness(.92) contrast(1.05);transition:filter 4s linear}
.teatro{--cw:clamp(26px,9vw,150px);--bh:clamp(34px,9vh,96px);--sh:clamp(40px,13vh,120px);position:fixed;inset:0;z-index:20;display:none;overflow:hidden}
.teatro.on{display:block}
.sala{position:absolute;inset:0;visibility:hidden;background:radial-gradient(ellipse 80% 62% at 50% 42%,#231318 0%,#0c0709 58%,#000 100%)}
.teatro.set .sala{visibility:visible}
.zona{position:absolute;left:var(--cw);right:var(--cw);top:var(--bh);bottom:var(--sh);display:flex;align-items:center;justify-content:center;container-type:size}
.pant{position:relative;aspect-ratio:16/9;width:min(100cqw - 20px,(100cqh - 20px) * 16 / 9);background:#000;box-shadow:0 0 0 2px #2b2b2e,0 0 0 5px #0a0a0b,0 0 70px rgba(170,195,255,.26),0 50px 110px rgba(130,160,255,.14)}
.pant iframe{display:block;width:100%;height:100%;border:0;background:#000}
.butacas{position:absolute;left:0;right:0;bottom:0;height:var(--sh);pointer-events:none}
.butacas::before,.butacas::after{content:'';position:absolute;left:0;right:0;bottom:0}
.butacas::before{height:100%;background:radial-gradient(ellipse 46% 100% at 50% 100%,#1b0e11 97%,transparent 100%) calc(var(--sh) * -.35) 0/calc(var(--sh) * .78) 100% repeat-x;opacity:.85}
.butacas::after{height:66%;background:radial-gradient(ellipse 46% 100% at 50% 100%,#070405 97%,transparent 100%) 0 0/calc(var(--sh) * 1.02) 100% repeat-x}
.telon{position:absolute;inset:0;pointer-events:none;transform:translateY(-104%)}
.teatro.cae .telon{animation:telonCae .95s cubic-bezier(.45,0,.85,.55) forwards}
.teatro.sube .telon{animation:telonSube .9s cubic-bezier(.5,0,.8,.45) forwards}
@keyframes telonCae{0%{transform:translateY(-104%)}72%{transform:translateY(0)}85%{transform:translateY(-1.5%)}100%{transform:translateY(0)}}
@keyframes telonSube{0%{transform:translateY(0)}100%{transform:translateY(-104%)}}
.telon i{position:absolute;top:0;bottom:0;width:50.5%;transition:width 2.3s cubic-bezier(.62,.04,.28,1);
  background:linear-gradient(180deg,rgba(0,0,0,.5),transparent 20%,transparent 78%,rgba(0,0,0,.55)),
    repeating-linear-gradient(90deg,#43030a 0,#8a0c17 2.4%,#d3202d 4.3%,#a8131e 5.8%,#5d060d 8.4%,#43030a 10%);
  box-shadow:inset 0 -3px 0 #6b4d14,inset 0 -11px 0 #d9b758,inset 0 -14px 0 #6b4d14}
.telon .tl{left:0}.telon .tr{right:0}
.teatro.abre .telon i{width:var(--cw)}
.telon b{position:absolute;left:0;right:0;top:0;height:var(--bh);
  background:linear-gradient(180deg,rgba(0,0,0,.55),transparent 55%),repeating-linear-gradient(90deg,#3a0208 0,#7d0a14 14px,#b91724 24px,#8f0e19 32px,#4d040a 46px,#3a0208 54px);
  box-shadow:inset 0 -3px 0 #6b4d14,inset 0 -9px 0 #d9b758,inset 0 -12px 0 #6b4d14,0 14px 30px rgba(0,0,0,.6)}
.telon b::after{content:'';position:absolute;left:0;right:0;top:100%;height:calc(var(--bh) * .34);background:radial-gradient(ellipse 50% 100% at 50% 0,#6e0811 96%,transparent 100%) 0 0/calc(var(--bh) * 1.5) 100% repeat-x;filter:drop-shadow(0 3px 0 #c9a548) drop-shadow(0 8px 10px rgba(0,0,0,.5))}
.tacts{position:absolute;z-index:3;top:calc(10px + env(safe-area-inset-top,0px));right:14px;display:flex;gap:8px;opacity:0;pointer-events:none;transition:opacity .5s}
.teatro.abre .tacts{opacity:1;pointer-events:auto}
.tacts .pill{height:32px;padding:0 12px;font-size:10px;text-decoration:none;color:#eee;background:rgba(0,0,0,.62)}
@media (prefers-reduced-motion:reduce){.telon i{transition-duration:.01s}.teatro.cae .telon,.teatro.sube .telon{animation-duration:.01s}.pano.hold{transition:none}}
</style>
</head>
<body>
<div class="pano" role="img" aria-label="KLUB"></div>
<div class="vig"></div>
<main class="apps">
  <div class="frame cine"><div class="mat"><iframe src="https://msp-theater.netlify.app/" title="POSTERS CINE" allow="autoplay; fullscreen" allowfullscreen></iframe></div><span>POSTERS CINE</span></div>
  <div class="frame"><div class="mat"><iframe src="https://msp-klub.netlify.app/" title="POSTERS KLUB" allow="autoplay; fullscreen" allowfullscreen></iframe></div><span>POSTERS KLUB</span></div>
</main>
<header class="top">
  <a href="../"><img src="../assets/logos/mediaservi-badge.svg" alt="mediaservi.com"></a>
  <div class="acts">
    <button class="pill snd" id="sndBtn" aria-label="Volumen"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="spk" d="M3 9v6h4l5 4V5L7 9z"/><path class="w1" d="M15.5 8.5a5 5 0 0 1 0 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path class="w2" d="M18.5 5.5a9 9 0 0 1 0 13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path class="x" d="M16 9l5 6M21 9l-5 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span class="lv"><i></i><i></i><i></i></span></button>
    <button class="pill" id="lock" aria-label="🔒"><svg viewBox="0 0 24 24"><path d="M12 1a5 5 0 0 0-5 5v4H5v13h14V10h-2V6a5 5 0 0 0-5-5zm-3 9V6a3 3 0 1 1 6 0v4z"/></svg></button>
    <a class="pill" href="../#conecta" id="back">← VOLVER</a>
  </div>
</header>
<div class="modal" id="modal">
  <form class="box" id="box" autocomplete="off">
    <h2><svg viewBox="0 0 24 24"><path d="M12 1a5 5 0 0 0-5 5v4H5v13h14V10h-2V6a5 5 0 0 0-5-5zm-3 9V6a3 3 0 1 1 6 0v4z"/></svg>KLUB</h2>
    <input type="password" id="pw" placeholder="••••••••" aria-label="Clave">
    <span class="err" id="err"></span>
    <div class="row"><button type="button" class="ko" id="cancel">✕</button><button type="submit" class="ok" id="okb">ENTRAR</button></div>
  </form>
</div>
<section class="priv" id="priv">
  <div class="ph"><b>KLUB · PRIVATE</b><button class="pill" id="out">✕</button></div>
  <div class="grid"><div class="card" id="soon">ÁLBUMES DE FOTOS · PRÓXIMAMENTE</div></div>
</section>
<div class="teatro" id="teatro" aria-hidden="true">
  <div class="sala"><div class="zona"><div class="pant" id="scr"></div></div><div class="butacas"></div></div>
  <div class="telon"><i class="tl"></i><i class="tr"></i><b></b></div>
  <div class="tacts"><a class="pill" id="cineYt" href="https://youtu.be/b7gHZ-fuMFg?list=PL5R9SjE9WlgxOl9KRdjj3SM0FN7ZOT9iZ" target="_blank" rel="noopener">YOUTUBE ↗</a><button class="pill" id="cineX">✕ CERRAR</button></div>
</div>
<audio id="bgm" src="../assets/audio/jazzklub.mp3" loop preload="auto" autoplay></audio>
<script>
(() => {
  const bgm = document.getElementById('bgm'), sndBtn = document.getElementById('sndBtn'), VOL = [0, .12, .4];
  let lvl = 1; try { const v = localStorage.getItem('ms-vol'); if (v !== null) lvl = +v; } catch (e) {} if (!(lvl >= 0 && lvl <= 2)) lvl = 1;
  const EMB = window.parent !== window && /[?&]in=1/.test(location.search);
  if (EMB) { bgm.removeAttribute('autoplay'); bgm.pause(); bgm.src = '';
    addEventListener('message', e => { if (e.origin === location.origin && e.data && e.data.klub === 'lvl') { lvl = e.data.lvl; sndBtn.dataset.v = lvl; } });
    parent.postMessage({ klub: 'hello' }, location.origin);
    document.getElementById('back').addEventListener('click', ev => { ev.preventDefault(); parent.postMessage({ klub: 'close' }, location.origin); }); }
  const applyVol = () => { sndBtn.dataset.v = lvl; if (EMB) return; bgm.volume = VOL[lvl]; bgm.muted = lvl === 0; };
  let hush = false;   // con la película en pantalla, la música de fondo calla
  const tryPlay = () => { if (!EMB && !hush && lvl > 0 && bgm.paused) bgm.play().catch(() => {}); };
  window.__klubHush = on => { hush = !!on; if (EMB) parent.postMessage({ klub: 'cine', on: hush }, location.origin); else if (hush) bgm.pause(); else tryPlay(); };
  applyVol(); tryPlay();
  const unlock = () => { tryPlay(); if (!bgm.paused || lvl === 0) ['pointerdown', 'keydown', 'touchstart'].forEach(ev => removeEventListener(ev, unlock, true)); };
  ['pointerdown', 'keydown', 'touchstart'].forEach(ev => addEventListener(ev, unlock, true));
  sndBtn.addEventListener('click', () => { lvl = (lvl + 2) % 3; try { localStorage.setItem('ms-vol', lvl); } catch (e) {} applyVol(); tryPlay(); if (EMB) parent.postMessage({ klub: 'vol', lvl }, location.origin); });
})();
(() => {
  let l = null; try { l = localStorage.getItem('ms-lang'); } catch (e) {}
  if (!l) { let tz = ''; try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch (e) {}
    l = /^(Europe\/Madrid|Atlantic\/Canary|Africa\/Ceuta|America\/(Mexico_City|Cancun|Merida|Monterrey|Bogota|Lima|Santiago|Caracas|Guayaquil|La_Paz|Asuncion|Montevideo|Argentina\/.+|Buenos_Aires|Havana|Santo_Domingo|Panama|Costa_Rica|Managua|Tegucigalpa|El_Salvador|Guatemala|Puerto_Rico))$/.test(tz) ? 'es' : 'en'; }
  const en = l === 'en';
  if (en) { document.documentElement.lang = 'en'; document.getElementById('back').textContent = '← BACK'; document.getElementById('okb').textContent = 'ENTER'; document.getElementById('soon').textContent = 'PHOTO ALBUMS · COMING SOON'; document.getElementById('cineX').textContent = '✕ CLOSE'; }
  const modal = document.getElementById('modal'), box = document.getElementById('box'), pw = document.getElementById('pw'), err = document.getElementById('err'), priv = document.getElementById('priv');
  const H = '2d8f894b33e630ddd07416938bcb8d9875677daf3bd7f04af6c700f7b62b1a3c';
  const sha = async t => [...new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t)))].map(b => b.toString(16).padStart(2, '0')).join('');
  document.getElementById('lock').addEventListener('click', () => { modal.classList.add('open'); err.textContent = ''; pw.value = ''; setTimeout(() => pw.focus(), 50); });
  document.getElementById('cancel').addEventListener('click', () => modal.classList.remove('open'));
  modal.addEventListener('click', e => { if (e.target === modal) modal.classList.remove('open'); });
  box.addEventListener('submit', async e => { e.preventDefault();
    if (await sha(pw.value.trim().toLowerCase()) === H) { modal.classList.remove('open'); priv.classList.add('open'); }
    else { err.textContent = en ? 'WRONG KEY' : 'CLAVE INCORRECTA'; box.classList.remove('shake'); void box.offsetWidth; box.classList.add('shake'); pw.select(); } });
  document.getElementById('out').addEventListener('click', () => priv.classList.remove('open'));
  addEventListener('keydown', e => { if (e.key === 'Escape') { modal.classList.remove('open'); } });
})();
/* ---------- zonas secretas: mantener pulsado 4 segundos y soltar ---------- */
(() => {
  const HOLD = 4000;
  // zona(el, dentro, hacer): «dentro» dice si el punto pulsado cuenta; «hacer» se ejecuta al soltar tras 4 s sin mover el dedo
  function zona(el, dentro, hacer) { let t0 = 0, x0 = 0, y0 = 0;
    const fin = ok => { if (!t0) return; const dt = performance.now() - t0; t0 = 0; el.classList.remove('hold'); if (ok && dt >= HOLD) hacer(); };
    el.addEventListener('pointerdown', e => { if (e.button > 0 || e.isPrimary === false || !dentro(e)) return; t0 = performance.now(); x0 = e.clientX; y0 = e.clientY; el.classList.add('hold'); try { el.setPointerCapture(e.pointerId); } catch (x) {} });
    el.addEventListener('pointermove', e => { if (t0 && Math.hypot(e.clientX - x0, e.clientY - y0) > 40) fin(false); });
    el.addEventListener('pointerup', () => fin(true)); el.addEventListener('pointercancel', () => fin(false));
    el.addEventListener('contextmenu', e => e.preventDefault()); }
  // cine: cae el telón rojo, se abre y la pantalla proyecta la lista de YouTube
  const teatro = document.getElementById('teatro'), scr = document.getElementById('scr'), cerrar = document.getElementById('cineX');
  const LISTA = 'https://www.youtube-nocookie.com/embed/b7gHZ-fuMFg?list=PL5R9SjE9WlgxOl9KRdjj3SM0FN7ZOT9iZ&autoplay=1&rel=0&playsinline=1';
  let abierto = false, ocupado = false;
  function abrirCine() { if (abierto || ocupado) return; abierto = ocupado = true; teatro.classList.add('on'); teatro.setAttribute('aria-hidden', 'false'); void teatro.offsetWidth; teatro.classList.add('cae');
    setTimeout(() => { teatro.classList.add('set'); try { window.__klubHush(true); } catch (e) {} scr.innerHTML = '<iframe src="' + LISTA + '" title="MEDIASERVI THEATER" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>'; }, 1000);
    setTimeout(() => { teatro.classList.add('abre'); ocupado = false; try { cerrar.focus({ preventScroll: true }); } catch (e) {} }, 1550); }
  function cerrarCine() { if (!abierto || ocupado) return; ocupado = true; teatro.classList.remove('abre');
    setTimeout(() => { scr.innerHTML = ''; teatro.classList.remove('set', 'cae'); teatro.classList.add('sube'); try { window.__klubHush(false); } catch (e) {} }, 2350);
    setTimeout(() => { teatro.classList.remove('on', 'sube'); teatro.setAttribute('aria-hidden', 'true'); abierto = ocupado = false; }, 3300); }
  cerrar.addEventListener('click', cerrarCine);
  addEventListener('keydown', e => { if (e.key === 'Escape' && abierto) cerrarCine(); });
  // el logo del fondo (cara de Mevi y letras KLUB), centrado en horizontal; en vertical lo tapa el póster y vale cualquier punto libre del fondo
  const pano = document.querySelector('.pano');
  zona(pano, e => matchMedia('(orientation:portrait)').matches || Math.hypot(e.clientX - innerWidth / 2, e.clientY - innerHeight * .53) <= innerHeight * .31, abrirCine);
})();
</script>
</body>
</html>
