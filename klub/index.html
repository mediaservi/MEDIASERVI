<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#2a2a2d;color:#eee;font-family:'Share Tech Mono',monospace}
body{height:100dvh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
/* fondo fijo: panorámica en blanco y negro centrada en el logo */
.pano{position:fixed;inset:0;background:#2a2a2d url(../assets/img/klub.webp) 50% 50%/auto 100% no-repeat;filter:grayscale(1) brightness(.62) contrast(1.05)}
.vig{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 35%,rgba(0,0,0,.7) 100%);pointer-events:none}
/* posters con marco dorado */
.apps{position:fixed;left:0;right:0;top:calc(76px + env(safe-area-inset-top,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;align-items:center;padding:0 clamp(10px,2vw,30px);pointer-events:none;container-type:size}
.frame{--P:clamp(12px,1.6vw,20px);position:relative;flex:none;padding:var(--P);pointer-events:auto;
  background:
    repeating-linear-gradient(90deg,rgba(255,240,190,.08) 0 1px,transparent 1px 3px),
    linear-gradient(135deg,#6e4f16 0%,#e6c46a 14%,#a9832f 30%,#f6e08f 46%,#9c7526 62%,#d8b457 78%,#6a4b14 100%);
  box-shadow:0 30px 70px rgba(0,0,0,.75),inset 0 0 0 1px #2c1f06,inset 0 0 0 3px #8f6c22,inset 3px 3px 5px rgba(255,244,200,.65),inset -4px -4px 8px rgba(50,32,4,.75)}
.frame::before{content:'';position:absolute;inset:calc(var(--P) - 7px);border:4px dotted #e9c967;border-radius:2px;box-shadow:0 0 0 2px #3a2a0a,inset 0 0 0 2px #3a2a0a;filter:drop-shadow(0 1px 0 rgba(0,0,0,.6))}
.frame .mat{position:relative;aspect-ratio:9/16;height:max(150px,min(calc(100cqh - 2 * var(--P)),calc((50cqw - 34vh - 2 * var(--P) - 12px) * 16 / 9)));padding:clamp(4px,.5vw,8px);background:#efe8d8;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25),inset 2px 2px 6px rgba(0,0,0,.35)}
.frame iframe{display:block;width:100%;height:100%;border:0;background:#111}
.frame span{position:absolute;left:50%;bottom:-26px;transform:translateX(-50%);white-space:nowrap;font-size:10px;letter-spacing:.24em;color:#cfc6b0;text-shadow:0 1px 2px #000}
@media (orientation:portrait){
  .apps{flex-direction:column;justify-content:center;gap:14px;top:calc(74px + env(safe-area-inset-top,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px))}
  .frame.cine{display:none}
  .frame .mat{height:min(calc(100cqh - 2 * var(--P)),calc((100cqw - 2 * var(--P)) * 16 / 9))}
  .frame span{display:none}
  .pano{background-size:auto 60%;background-position:50% 45%;filter:grayscale(1) brightness(.28)}
  .vig{background:radial-gradient(ellipse 55% 60% at 50% 50%,transparent 20%,rgba(0,0,0,.92) 85%)}
}
/* cabecera */
.top{position:fixed;left:0;right:0;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:calc(14px + env(safe-area-inset-top,0px)) 18px 0}
.top a{display:flex;align-items:center;text-decoration:none;color:#eee}
.top img{width:48px;height:48px;filter:drop-shadow(0 4px 14px rgba(0,0,0,.7))}
.acts{display:flex;gap:10px;align-items:center}
.pill{display:flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:999px;border:1px solid rgba(255,255,255,.3);background:rgba(0,0,0,.5);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);font-size:11px;letter-spacing:.24em;transition:border-color .25s,color .25s}
.pill:hover{border-color:#e9c967;color:#e9c967}
.pill[hidden]{display:none}
.pill svg{width:14px;height:14px;fill:currentColor}
/* volumen */
.snd svg{width:18px;height:18px}.snd .spk{fill:currentColor}
.snd .lv{display:flex;gap:2px;align-items:flex-end;height:12px}.snd .lv i{width:3px;border-radius:1px;background:currentColor;opacity:.25}
.snd .lv i:nth-child(1){height:4px}.snd .lv i:nth-child(2){height:8px}.snd .lv i:nth-child(3){height:12px}
.snd[data-v="0"] .w1,.snd[data-v="0"] .w2,.snd[data-v="1"] .w2,.snd:not([data-v="0"]) .x{display:none}
.snd[data-v="1"] .lv i:nth-child(-n+2),.snd[data-v="2"] .lv i{opacity:1}
.snd[data-v="2"]{color:#e9c967}
/* candado y zona privada */
.modal{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.modal.open{display:flex}
.box{width:min(360px,88vw);display:flex;flex-direction:column;gap:14px;padding:24px;border-radius:10px;background:#18171b;border:1px solid rgba(233,201,103,.45);box-shadow:0 30px 70px rgba(0,0,0,.7)}
.box h2{display:flex;align-items:center;gap:10px;font:900 16px/1 Inter,sans-serif;letter-spacing:.2em;color:#e9c967}
.box h2 svg{width:18px;height:18px;fill:currentColor}
.box input{height:44px;padding:0 14px;border-radius:6px;border:1px solid rgba(255,255,255,.2);background:#0d0c10;color:#fff;font:600 16px/1 'Share Tech Mono',monospace;letter-spacing:.2em}
.box input:focus{outline:none;border-color:#e9c967}
.box .row{display:flex;gap:10px;justify-content:flex-end}
.box .ok{padding:10px 16px;border-radius:6px;background:linear-gradient(90deg,#c9a548,#f2d98a);color:#1a1405;font:900 12px/1 Inter,sans-serif;letter-spacing:.16em}
.box .ko{padding:10px 16px;border-radius:6px;border:1px solid rgba(255,255,255,.2);font-size:11px;letter-spacing:.16em}
.box .err{min-height:14px;font-size:11px;letter-spacing:.14em;color:#ff6b6b}
.box.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.priv{position:fixed;inset:0;z-index:8;display:none;flex-direction:column;background:#111013}
.priv.open{display:flex}
.priv .ph{display:flex;justify-content:space-between;align-items:center;padding:calc(18px + env(safe-area-inset-top,0px)) 18px 16px;border-bottom:1px solid rgba(233,201,103,.25)}
.priv .ph b{font:900 16px/1 Inter,sans-serif;letter-spacing:.3em;color:#e9c967}
.priv .grid{flex:1;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;padding:20px;align-content:start;overflow:auto}
.priv .card{display:flex;align-items:center;justify-content:center;min-height:140px;border-radius:8px;border:1px dashed rgba(233,201,103,.35);color:#8d8676;font-size:11px;letter-spacing:.2em;text-align:center;padding:10px}
/* cine secreto: 4 s pulsando el logo del fondo y, al soltar, cae el telón rojo y se abre ante la pantalla */
.pano{touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;transition:filter .6s}
.pano.hold{filter:grayscale(0) brightness(.92) contrast(1.05);transition:filter 4s linear}
.teatro{--cw:clamp(26px,9vw,150px);--bh:clamp(34px,9vh,96px);--sh:clamp(40px,13vh,120px);position:fixed;inset:0;z-index:20;display:none;overflow:hidden}
.teatro.on{display:block}
.sala{position:absolute;inset:0;z-index:0;isolation:isolate;visibility:hidden;background:radial-gradient(ellipse 80% 62% at 50% 42%,#231318 0%,#0c0709 58%,#000 100%)}
.teatro.set .sala{visibility:visible}
.zona{position:absolute;left:var(--cw);right:var(--cw);top:calc(var(--bh) * .92);bottom:calc(var(--sh) * .74);display:flex;align-items:center;justify-content:center;container-type:size}
.pant{position:relative;aspect-ratio:16/9;width:min(100cqw - 20px,100cqh * 16 / 9);background:#000;box-shadow:0 0 0 2px #2b2b2e,0 0 0 5px #0a0a0b,0 0 70px rgba(170,195,255,.26),0 50px 110px rgba(130,160,255,.14)}
.pant{overflow:hidden}
/* el reproductor es más alto que la pantalla y no recibe el ratón: su título, su barra y su logo quedan fuera de la vista */
.pant iframe,.pant #ytCine{position:absolute;left:0;top:-64px;width:100%;height:calc(100% + 128px);border:0;background:#000;pointer-events:none}
.pant .lider{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}   /* sin fondo propio: lo que se quema deja ver el vídeo */
.butacas{position:absolute;left:0;right:0;bottom:0;z-index:3;width:100%;height:calc(var(--sh) * 1.75);pointer-events:none;transform:translateY(104%);transition:transform .7s cubic-bezier(.2,.8,.3,1)}
.teatro.set .butacas{transform:none}   /* dos filas de butacas vistas desde atrás, dibujadas por código, por delante de la pantalla */
.telon{position:absolute;inset:0;z-index:2;pointer-events:none;transform:translateY(-104%)}
.teatro.cae .telon{animation:telonCae .95s cubic-bezier(.45,0,.85,.55) forwards}
.teatro.sube .telon{animation:telonSube .9s cubic-bezier(.5,0,.8,.45) forwards}
@keyframes telonCae{0%{transform:translateY(-104%)}72%{transform:translateY(0)}85%{transform:translateY(-1.5%)}100%{transform:translateY(0)}}
@keyframes telonSube{0%{transform:translateY(0)}100%{transform:translateY(-104%)}}
.telon i{position:absolute;top:0;bottom:0;width:50.5%;transition:width 5s cubic-bezier(.62,.04,.28,1);
  background:linear-gradient(180deg,rgba(0,0,0,.5),transparent 20%,transparent 78%,rgba(0,0,0,.55)),
    repeating-linear-gradient(90deg,#43030a 0,#8a0c17 2.4%,#d3202d 4.3%,#a8131e 5.8%,#5d060d 8.4%,#43030a 10%);
  box-shadow:inset 0 -3px 0 #6b4d14,inset 0 -11px 0 #d9b758,inset 0 -14px 0 #6b4d14}
.telon .tl{left:0}.telon .tr{right:0}
.teatro.abre .telon i{width:var(--co,var(--cw))}
.telon b{position:absolute;left:0;right:0;top:0;height:var(--bh);
  background:linear-gradient(180deg,rgba(0,0,0,.55),transparent 55%),repeating-linear-gradient(90deg,#3a0208 0,#7d0a14 14px,#b91724 24px,#8f0e19 32px,#4d040a 46px,#3a0208 54px);
  box-shadow:inset 0 -3px 0 #6b4d14,inset 0 -9px 0 #d9b758,inset 0 -12px 0 #6b4d14,0 14px 30px rgba(0,0,0,.6)}
.telon b::after{content:'';position:absolute;left:0;right:0;top:100%;height:calc(var(--bh) * .34);background:radial-gradient(ellipse 50% 100% at 50% 0,#6e0811 96%,transparent 100%) 0 0/calc(var(--bh) * 1.5) 100% repeat-x;filter:drop-shadow(0 3px 0 #c9a548) drop-shadow(0 8px 10px rgba(0,0,0,.5))}
/* telón de terciopelo con caída y vaivén (WebGL); si el dispositivo no puede, queda el telón sencillo de arriba */
.tgl{position:absolute;inset:0;z-index:2;width:100%;height:100%;pointer-events:none;display:none}
.teatro.gl .tgl{display:block}.teatro.gl .telon{display:none}
.teatro.gl .zona{top:calc(var(--bh) * .36)}
.ticket{position:fixed;inset:0;z-index:15;display:grid;place-items:center;pointer-events:none;visibility:hidden}
.ticket.on{visibility:visible}
.ticket canvas{position:absolute;inset:0;width:100%;height:100%}
/* billete dorado: aparece cuando ya se puede soltar */
.tk{--tw:min(80vw,540px,150vh);position:relative;width:var(--tw);aspect-ratio:2.15/1;display:flex;align-items:stretch;color:#3d2903;font-family:"Times New Roman",Georgia,"DejaVu Serif",serif;transform:rotate(-4deg) scale(.4);opacity:0;
  background:linear-gradient(115deg,#8a6312 0%,#f6e27a 16%,#c9971f 33%,#fff6b8 50%,#b8860b 67%,#f1d56b 84%,#7a560e 100%);
  -webkit-mask:radial-gradient(circle at 0 50%,transparent calc(var(--tw) * .052),#000 calc(var(--tw) * .054)) left/51% 100% no-repeat,radial-gradient(circle at 100% 50%,transparent calc(var(--tw) * .052),#000 calc(var(--tw) * .054)) right/51% 100% no-repeat;mask:radial-gradient(circle at 0 50%,transparent calc(var(--tw) * .052),#000 calc(var(--tw) * .054)) left/51% 100% no-repeat,radial-gradient(circle at 100% 50%,transparent calc(var(--tw) * .052),#000 calc(var(--tw) * .054)) right/51% 100% no-repeat;
  container-type:inline-size}
.ticket::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 46% 36% at 50% 50%,rgba(0,0,0,.6),transparent 72%);opacity:0;transition:opacity .4s}.ticket.on::before{opacity:1}
.ticket.on .tk{animation:tkpop .55s cubic-bezier(.2,1.5,.4,1) forwards}
@keyframes tkpop{to{transform:rotate(-4deg) scale(1);opacity:1}}
.tk::before{content:'';position:absolute;inset:3.2cqw 7cqw;border:.5cqw double #6b4a08;border-radius:1.2cqw;opacity:.75}
.tk::after{content:'';position:absolute;inset:0;background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.75) 50%,transparent 62%);background-size:260% 100%;animation:tkbrillo 1.8s linear infinite;mix-blend-mode:soft-light}
@keyframes tkbrillo{from{background-position:130% 0}to{background-position:-130% 0}}
.tk .c{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2cqw;padding:0 3cqw 0 9cqw;text-align:center;text-shadow:0 1px 0 rgba(255,246,200,.75),0 -1px 0 rgba(70,45,0,.35)}
.tk .c small{font:700 2.9cqw/1 "Share Tech Mono",monospace;letter-spacing:.42em}
.tk .c b{font-weight:900;font-size:12.5cqw;line-height:.95;letter-spacing:.04em}
.tk .c b em{display:block;font-style:normal;font-size:5.1cqw;line-height:1.25;letter-spacing:.12em}
.tk .c i{font:700 3.3cqw/1 "Share Tech Mono",monospace;font-style:normal;letter-spacing:.3em;padding:1.1cqw 2.4cqw;border-top:.35cqw solid #6b4a08;border-bottom:.35cqw solid #6b4a08}
.tk .m{flex:none;width:19%;display:flex;align-items:center;justify-content:center;border-left:.45cqw dashed #6b4a08;margin:3.2cqw 7cqw 3.2cqw 0;padding-left:1cqw}
.tk .m span{writing-mode:vertical-rl;transform:rotate(180deg);font:900 3.6cqw/1.25 "Share Tech Mono",monospace;letter-spacing:.24em;text-align:center}
@media (prefers-reduced-motion:reduce){.ticket.on .tk{animation-duration:.01s}.tk::after{animation:none}}
.tacts{position:absolute;z-index:4;top:calc(10px + env(safe-area-inset-top,0px));right:14px;display:flex;gap:8px;opacity:0;pointer-events:none;transition:opacity .5s}
.teatro.abre .tacts{opacity:1;pointer-events:auto}
.tacts .pill{height:32px;padding:0 12px;font-size:10px;text-decoration:none;color:#eee;background:rgba(0,0,0,.62)}
@media (prefers-reduced-motion:reduce){.telon i{transition-duration:.01s}.teatro.cae .telon,.teatro.sube .telon{animation-duration:.01s}.pano.hold{transition:none}}
</style>
</head>

<script id="telonFS" type="x-shader/x-fragment">
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
uniform vec2 uRes; uniform float uT,uD,uTop,uBotL,uBotR,uE,uN,uBh;
float gYb;
float hash(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }
float vn(vec2 p){ vec2 i=floor(p),f=fract(p); f=f*f*(3.-2.*f); return mix(mix(hash(i),hash(i+vec2(1.,0.)),f.x),mix(hash(i+vec2(0.,1.)),hash(i+vec2(1.,1.)),f.x),f.y); }
vec3 oro(float l,float sp){ return mix(vec3(.26,.16,.03),vec3(1.,.82,.40),clamp(l,0.,1.))+vec3(1.,.96,.8)*sp; }
float chispa(vec2 q){ vec2 c=floor(q); float r=hash(c+floor(uT*4.+hash(c)*7.)*.173); return step(.965,r)*smoothstep(.5,.1,length(fract(q)-.5)); }
vec3 terciopelo(float n,float h,float lx,float g){
  float nz=sqrt(max(0.,1.-n*n)),dif=clamp(n*lx+nz*.9,0.,1.),rim=pow(1.-nz,1.7);
  vec3 c=vec3(.52,.015,.045)*(.07+1.1*pow(dif,2.3));
  c+=vec3(1.,.20,.22)*rim*.20*clamp(.55+n*lx*2.,0.,1.);
  c*=mix(.30,1.,smoothstep(0.,.6,h));
  return c*(.84+.32*g); }
vec4 hoja(float x,float Y,float eb,float sg,float asp){
  if(Y>1.04) return vec4(0.);
  float t=uT+sg*1.7,s=pow(clamp(Y,0.,1.),1.6);
  float wave=uE*(.016*sin(Y*6.5-t*5.2)+.007*sin(Y*12.-t*8.3+1.3))*(.25+Y);
  float e=max(mix(uTop,eb,s)+wave+.0022*sin(t*.8+Y*2.4)*Y,.012);
  float u=x/e;
  if(u>1.){ float d=(x-e)*asp; return vec4(0.,0.,0.,.5*exp(-d/.028)*step(Y,.985)); }
  float gath=clamp(1.-e/.505,0.,1.),gu=u*.505*asp;
  float ph=u*uN*6.2832+.5*sin(u*uN*1.9+1.3+sg)+.22*sin(Y*4.3+u*7.+sg*2.)+uE*.9*sin(Y*8.-t*6.+u*6.)*(.3+Y);
  float h=.5+.5*cos(ph),sl=-sin(ph)*(.9+2.3*gath),n=-sl/sqrt(1.+sl*sl)*sg;
  float g=vn(vec2(gu*1100.,Y*150.))*.6+vn(vec2(gu*3000.,Y*1100.))*.4;
